name: Set up Nix
description: Install Nix and restore the nix store from the GitHub Actions cache.

runs:
  using: composite
  steps:
    # ubuntu's apparmor lets an unprivileged process create a user namespace but not
    # map ids in it, and the config check runs asterisk in a namespace of its own
    # from inside the build sandbox. https://github.com/actions/runner-images/issues/10443
    - name: Allow unprivileged user namespaces
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    # also opens /dev/kvm to the build users, which the vm tests need
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ github.token }}

    # keyed on flake.lock. after a lock bump a job restores the newest older store,
    # and the first job to finish saves the new key
    - name: Cache the nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 4G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-last-accessed: 0
        purge-primary-key: never
