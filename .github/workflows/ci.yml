name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write # cache-nix-action purges stale nix-store caches

jobs:
  # the groups of legacyPackages.ci in flake.nix, whose checks nix-fast-build
  # evaluates in parallel. two workers keep the checks group near 7 GB of the
  # runner's 16
  checks:
    name: ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [lint, checks]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - run: >
          nix run --inputs-from . nixpkgs#nix-fast-build --
          --flake '.#legacyPackages.x86_64-linux.ci.${{ matrix.group }}'
          --eval-workers 2 --no-nom --no-link
