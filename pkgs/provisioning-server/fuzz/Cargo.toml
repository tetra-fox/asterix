[package]
name = "provisioning-server-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
provisioning-server = { path = ".." }
tokio = { version = "1", features = ["io-util", "macros", "rt", "test-util", "time"] }

[[bin]]
name = "connection"
path = "fuzz_targets/connection.rs"
test = false
doc = false
bench = false
